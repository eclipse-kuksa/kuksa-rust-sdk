[workspace]
resolver = "2"

members = [
    "databroker-examples",
    "kuksa-rust-sdk",
]

[workspace.dependencies]
kuksa-rust-sdk = { path = "kuksa-rust-sdk" }

# prost has no features
prost = "0.14"
# prost-types has no features
prost-types = "0.14"
# tokio does not enable features by default
tokio = "1.17.0"
# tokio-stream has no features
tokio-stream = "0.1.8"
tonic = { version = "0.14", default-features = false }
tonic-build = { version = "0.14", default-features = false }
tonic-prost = { version = "0.14" }
tonic-prost-build = { version = "0.14" }
